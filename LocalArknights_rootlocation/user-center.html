<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
	<meta name="color-scheme" content="only light">
	<meta http-equiv="Cache-Control" content="no-store">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=0,initial-scale=1">
	<meta name="keywords" content="">
	<meta name="description" content="用户中心，提供账号信息、安全设置等功能">
	<title>用户中心</title>
	<style>
		:root {
			--bg: #f5f6f8;
			--card: #ffffff;
			--text: #2b2b2b;
			--text-sub: #7a7f87;
			--primary: #23a3d6;
			--primary-dark: #1b86b3;
			--danger: #e5484d;
			--border: #e6e8eb;
			--radius: 12px;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
		}

		.header {
			background: linear-gradient(135deg, var(--primary), var(--primary-dark));
			color: #fff;
			padding: 48px 16px 88px;
		}

		.header-inner {
			max-width: 960px;
			margin: 0 auto;
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.avatar {
			width: 84px;
			height: 84px;
			border-radius: 50%;
			background: rgba(255, 255, 255, .25);
			border: 3px solid rgba(255, 255, 255, .6);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 34px;
			flex-shrink: 0;
		}

		.user-meta h1 { font-size: 22px; font-weight: 600; }
		.user-meta p { font-size: 13px; opacity: .85; margin-top: 6px; }

		.logout-btn {
			margin-left: auto;
			background: rgba(255, 255, 255, .18);
			border: 1px solid rgba(255, 255, 255, .45);
			color: #fff;
			padding: 8px 20px;
			border-radius: 999px;
			cursor: pointer;
			font-size: 13px;
			transition: background .2s;
		}
		.logout-btn:hover { background: rgba(255, 255, 255, .3); }

		.main {
			max-width: 960px;
			margin: -56px auto 40px;
			padding: 0 16px;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
		}

		.card {
			background: var(--card);
			border-radius: var(--radius);
			box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
			padding: 24px;
		}

		.card.wide { grid-column: 1 / -1; }

		.card h2 {
			font-size: 16px;
			font-weight: 600;
			padding-bottom: 12px;
			margin-bottom: 16px;
			border-bottom: 1px solid var(--border);
		}

		.info-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px 0;
			font-size: 14px;
		}
		.info-row + .info-row { border-top: 1px dashed var(--border); }
		.info-row .label { color: var(--text-sub); }
		.info-row .value { font-weight: 500; }

		.badge {
			font-size: 12px;
			padding: 2px 10px;
			border-radius: 999px;
			background: #e8f6fd;
			color: var(--primary);
		}
		.badge.green { background: #e8f8ee; color: #2ba14f; }

		.menu-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 13px 4px;
			font-size: 14px;
			cursor: pointer;
			border-radius: 8px;
			transition: background .15s;
		}
		.menu-item:hover { background: #f4f8fb; }
		.menu-item .arrow { color: #c0c4cc; }
		.menu-item.danger { color: var(--danger); }

		.game-item {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 12px 4px;
			cursor: pointer;
			border-radius: 8px;
			transition: background .15s;
		}
		.game-item:hover { background: #f4f8fb; }
		.game-item + .game-item { border-top: 1px dashed var(--border); }
		.game-icon {
			width: 44px;
			height: 44px;
			border-radius: 10px;
			background: linear-gradient(135deg, #e8f6fd, #d2ecf9);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 22px;
			flex-shrink: 0;
		}
		.game-info { flex: 1; }
		.game-info .name { font-size: 14px; font-weight: 500; }
		.game-info .server { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
		.game-info .uid { font-size: 12px; color: var(--text-sub); margin-top: 1px; }

		.device-item {
			display: flex;
			justify-content: space-between;
			font-size: 13px;
			padding: 10px 0;
			color: var(--text-sub);
		}
		.device-item + .device-item { border-top: 1px dashed var(--border); }
		.device-item .device-name { color: var(--text); font-weight: 500; }

		@media (max-width: 640px) {
			.main { grid-template-columns: 1fr; }
			.header { padding: 36px 16px 80px; }
		}
	</style>
</head>

<body>
	<header class="header">
		<div class="header-inner">
			<div class="avatar">👤</div>
			<div class="user-meta">
				<h1 id="nickname">LoongLing</h1>
				<p>UID：<span id="uid">-</span></p>
			</div>
			<button class="logout-btn" onclick="logout()">退出登录</button>
		</div>
	</header>

	<main class="main">
		<section class="card">
			<h2>账号信息</h2>
			<div class="info-row"><span class="label">昵称</span><span class="value" id="info-nickname">LoongLing</span></div>
			<div class="info-row"><span class="label">UID</span><span class="value" id="info-uid">-</span></div>
			<div class="info-row"><span class="label">手机号</span><span class="value" id="info-phone">-</span></div>
			<div class="info-row"><span class="label">实名认证</span><span class="value"><span class="badge green">LocalArknights</span></span></div>
		</section>

		<section class="card">
			<h2>安全设置</h2>
			<div class="menu-item" onclick="changePassword()"><span>修改密码</span><span class="arrow">›</span></div>
			<div class="menu-item" onclick="alert('Ciallo～(∠・ω< )⌒★')"><span>绑定邮箱</span><span class="badge green">有问题请提交issue</span></div>
			<div class="menu-item" onclick="alert('想什么呢？不支持哦，喵~')"><span>绑定手机</span><span class="badge green">这是一个开源项目</span></div>
			<div class="menu-item danger" onclick="alert('不支持，喵~')"><span>注销账号</span><span class="arrow">›</span></div>
		</section>

	</main>

	<script>
		// 未登录跳回登录页
		if (!localStorage.getItem("token") || !localStorage.getItem("uid")) {
			window.location.href = "login.html";
		}

		function render() {
			const uid = localStorage.getItem("uid") || "-";
			document.getElementById("nickname").textContent = "LoongLing";
			document.getElementById("info-nickname").textContent = "LoongLing";
			document.getElementById("uid").textContent = uid;
			document.getElementById("info-uid").textContent = uid;
			document.getElementById("info-phone").textContent = localStorage.getItem("phone") || "-";
		}

		function logout() {
			if (confirm("确定退出登录吗？")) {
				localStorage.removeItem("token");
				localStorage.removeItem("code");
				localStorage.removeItem("uid");
				localStorage.removeItem("phone");
				window.location.href = "login.html";
			}
		}

		const CHANGE_PWD_URL = "http://127.0.0.1:10029/user/forget_password";

		async function changePassword() {
			const code = localStorage.getItem("code");
			if (!code) {
				alert("登录状态已失效，请重新登录");
				window.location.href = "login.html";
				return;
			}

			const password = prompt("请输入新密码：");
			if (password === null) return;              // 用户取消
			if (!password) { alert("密码不能为空"); return; }

			const password2 = prompt("请再次输入新密码：");
			if (password2 === null) return;
			if (password !== password2) { alert("两次输入的密码不一致"); return; }

			try {
				const resp = await fetch(CHANGE_PWD_URL, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ secret: code, password: password })
				});
				const result = await resp.json();

				if (result.result === 0) {
					alert("密码修改成功，请重新登录");
					logout();
				} else {
					alert(result.msg || "修改失败，请稍后重试");
				}
			} catch (err) {
				alert("网络错误，无法连接服务器");
			}
		}

		render();
	</script>
</body>

</html>
